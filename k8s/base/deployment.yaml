apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-os
  labels:
    app: ms-os
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-os
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ms-os
    spec:
      initContainers:
        # Migrations do banco PRÓPRIO deste microsserviço. Nenhum outro serviço
        # tem credencial para este MySQL.
        - name: migrate
          image: fiap-tc-ms-os
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/src/migrate.js"]
          envFrom:
            - configMapRef:
                name: ms-os-config
            - secretRef:
                name: ms-os-secret
      containers:
        - name: ms-os
          image: fiap-tc-ms-os
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Carrega o agente APM antes da aplicação, habilitando o tracing
            # distribuído entre os três microsserviços.
            - name: NODE_OPTIONS
              value: "-r newrelic"
          envFrom:
            - configMapRef:
                name: ms-os-config
            - secretRef:
                name: ms-os-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
