apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-os-config
data:
  # Valores não sensíveis. Os sensíveis (DB_*, RABBITMQ_URL, licença do New
  # Relic, IDs do Cognito) vêm do Secret "ms-os-secret", criado pelo pipeline a
  # partir do AWS Systems Manager Parameter Store.
  PORT: "3000"
  NODE_ENV: "production"
  SERVICE_NAME: "fiap-tc-ms-os"
  DB_PORT: "3306"
  DB_NAME: "fiap_tc_os"
  LOG_LEVEL: "info"
  AUTH_DISABLED: "false"
  # Prefetch baixo: o orquestrador prefere processar poucas respostas por vez e
  # manter a ordem dos passos a acumular mensagens em memória.
  RABBITMQ_PREFETCH: "10"
  SAGA_MAX_TENTATIVAS: "3"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_LOCAL_DECORATING_ENABLED: "false"
  NEW_RELIC_LOG: "stdout"
