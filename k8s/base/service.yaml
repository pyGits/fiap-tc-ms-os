apiVersion: v1
kind: Service
metadata:
  name: ms-os-service
  annotations:
    # NLB interno criado pelo controlador nativo do EKS. O API Gateway alcança
    # este NLB pelo VPC Link — o microsserviço não fica exposto na internet.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: ms-os
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
