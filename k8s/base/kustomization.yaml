apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base comum aos dois ambientes. Namespace, réplicas, imagem e variáveis
# específicas ficam nos overlays (hml e prd).
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
